name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The wizard is skipped in CI; these are the values it would have written for a run
  # without Docker, and the only ones the gates need.
  CI: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # The suite runs the database tests against every driver it can reach, so with this
    # service up the same specs are proven on PGlite and on the PostgreSQL of production.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wolfchatter
          POSTGRES_DB: wolfchatter
          POSTGRES_PASSWORD: wolfchatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolfchatter -d wolfchatter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests with the 100% coverage gate
        run: npm run test
        env:
          DATABASE_URL: postgres://wolfchatter:wolfchatter@localhost:5432/wolfchatter

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wolfchatter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id wolfchatter:ci -un)" = node

  # The single required status check on main. Adding a gate above means adding one name
  # here, and `if: always()` makes this job report even when a gate failed or was skipped.
  all-green:
    if: always()
    needs: [lint, typecheck, test, build, audit, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Report what each gate returned
        run: echo '${{ toJSON(needs) }}'
      - name: Fail unless every gate succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
