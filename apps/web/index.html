<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wolfchatter</title>
    <meta name="description" content="Real-time chat pinned to a map. Click anywhere to open a chatroom." />
    <!-- One file for both themes: the mark carries its own prefers-color-scheme block. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f6f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131114" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
