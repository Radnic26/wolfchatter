services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wolfchatter
      POSTGRES_DB: wolfchatter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./start-wolfchatter first, it writes .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data in a major-version subdirectory of this path, so the
      # mount goes one level above the old /var/lib/postgresql/data and survives pg_upgrade.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolfchatter -d wolfchatter"]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true

  app:
    build:
      context: .
      # The bundle is built inside the image, where .env is neither copied nor read, so the
      # tile answer only survives as a build argument.
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?run ./start-wolfchatter first, it writes .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # .env documents this one and the container could not see it, so naming the header a
      # proxy appends did nothing at all. It is passed through by name rather than
      # interpolated, because an interpolated default would set it to the empty string and
      # the server reads that as a misconfigured value and refuses to start.
      TRUSTED_CLIENT_HEADER:
      # Passed through by name for the same reason: an interpolated default would set it to
      # the empty string, which is not a boolean and stops the server at startup.
      SEED_SAMPLE_DATA:
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    # PID 1 in a container gets no default signal handlers; this reaps and forwards for us.
    init: true
    # A scanner walking unmatched /api paths meets no rate limiter and writes a log line for
    # each one, and the default json-file driver rotates nothing, so the bound goes here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
